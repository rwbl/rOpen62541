  - type: sections
    max_columns: 4
    title: OPC UA
    path: opc-ua
    sections:
      - type: grid
        cards:
          - type: gauge
            entity: sensor.opc_ua_temperature
            needle: true
            severity:
              green: 0
              yellow: 70
              red: 90
          - type: gauge
            entity: sensor.opc_ua_humidity
            needle: true
            severity:
              green: 0
              yellow: 22
              red: 24
            min: 15
            max: 25
          - type: gauge
            entity: sensor.opc_ua_availableram
            min: 0
            max: 100000
            needle: true
            severity:
              green: 30000
              yellow: 20000
              red: 0
      - type: grid
        cards:
          - type: heading
            heading: DHT22 Sensor Data
          - type: entities
            entities:
              - entity: sensor.opcua_temperature
                secondary_info: last_changed
                icon: mdi:thermometer-low
              - entity: sensor.opcua_humidity
                secondary_info: last_changed
                icon: mdi:water-percent
              - entity: sensor.opc_ua_availableram
                secondary_info: last_changed
                icon: mdi:memory
          - type: markdown
            content: >
              ### rOpen62541


              [rOpen62541](https://github.com/rwbl/rOpen62541) is an
              [B4R](https://www.b4x.com/b4r.html) open-source library wrapper
              for the industrial [open62541](https://open62541.org) OPC UA
              protocol stack, specifically optimized for the ESP32-S3 Dual-Core
              architecture.


              It provides thread-safe cross-core communication, dynamic
              string-node creation, and type-agnostic runtime write diagnostics.
            text_only: true
    cards: []
    icon: mdi:explore
    show_icon_and_title: true
    header:
      card:
        type: markdown
        text_only: true
        content: >
          # Example OPC UA Server

          Demonstrate a bi-directional industrial environmental system using a
          <B>DHT22</B> sensor connected to the <B>ESP32-S3-N16R8</B> running as
          OPC UA server.
    footer: {}
